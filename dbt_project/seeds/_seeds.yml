version: 2

seeds:
  - name: categoria_documento
    description: "Clasifica cada combinación de grupo y tipo de documento DIAN en una categoría de negocio y un signo."
    columns:
      - name: categoria
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["venta", "compra", "pago_prestadores", "nomina", "evento_dian"]
      - name: signo
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [-1, 0, 1]
                quote: false

  - name: categoria_etiqueta
    description: "Nombre legible, tipo de flujo (ingreso o egreso) y orden de cada categoría que llega al modelo final."
    columns:
      - name: categoria
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('categoria_documento')
                field: categoria
      - name: tipo_flujo
        tests:
          - accepted_values:
              arguments:
                values: ["ingreso", "egreso"]

  - name: forma_pago
    description: "Traduce el código de forma de pago de la DIAN (1 contado, 2 crédito). Confirmar con el cliente."
    config:
      column_types:
        codigo: string
    columns:
      - name: codigo
        tests:
          - unique
          - not_null
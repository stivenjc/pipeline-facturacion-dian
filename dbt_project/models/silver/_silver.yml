version: 2

models:
  - name: slv_documentos
    description: "Documentos DIAN con tipos correctos y sin duplicados."
    columns:
      - name: cufe_cude
        tests:
          - unique
          - not_null
      - name: fecha_emision
        tests:
          - not_null
      - name: total
        tests:
          - not_null

  - name: slv_documentos_clasificados
    description: "Cada documento con su categoría de negocio, su signo y sus montos netos."
    columns:
      - name: cufe_cude
        tests:
          - unique
          - not_null
      - name: categoria
        description: "Si queda vacía, apareció un tipo de documento que no está en el seed."
        tests:
          - not_null
